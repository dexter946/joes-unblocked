<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171933;color:white;font-family:Arial}canvas{width:min(88vw,480px);height:auto;border:2px solid #b29aff}p{text-align:center;color:#b7c4e5}</style></head><body><div><canvas width="400" height="400"></canvas><p>Use ← → or A / D to dodge</p></div><script>let c=document.querySelector('canvas'),x=c.getContext('2d'),p=180,k={},r=[];onkeydown=e=>k[e.key]=1;onkeyup=e=>k[e.key]=0;function l(){if(k.ArrowLeft||k.a)p-=5;if(k.ArrowRight||k.d)p+=5;p=Math.max(0,Math.min(360,p));if(Math.random()<.04)r.push({x:Math.random()*380,y:-20,s:10+Math.random()*14});r.forEach(a=>a.y+=3);r=r.filter(a=>a.y<430);if(r.some(a=>a.y>360&&a.x<p+40&&a.x+a.s>p)){r=[];p=180}x.fillStyle='#171933';x.fillRect(0,0,400,400);x.fillStyle='#ff9d66';r.forEach(a=>{x.beginPath();x.arc(a.x,a.y,a.s,0,7);x.fill()});x.fillStyle='#b29aff';x.fillRect(p,370,40,12);requestAnimationFrame(l)}l()</script></body></html>
