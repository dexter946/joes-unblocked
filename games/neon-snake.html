<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171933;color:#fff;font-family:Arial}canvas{width:min(88vw,480px);height:auto;border:2px solid #5ce5e6}.tip{margin:15px;text-align:center;color:#b7c4e5}</style></head><body><div><canvas width="400" height="400"></canvas><p class="tip">Arrow keys / WASD · Collect the pink sparks</p></div><script>let c=document.querySelector('canvas'),x=c.getContext('2d'),b=[{x:10,y:10}],d={x:1,y:0},n=d,f={x:4,y:5};onkeydown=e=>{let q={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(q&&q[0]!=-d.x&&q[1]!=-d.y)n={x:q[0],y:q[1]}};setInterval(()=>{d=n;let h={x:b[0].x+d.x,y:b[0].y+d.y};if(h.x<0||h.y<0||h.x>19||h.y>19||b.some(p=>p.x==h.x&&p.y==h.y)){b=[{x:10,y:10}];d=n={x:1,y:0};f={x:4,y:5}}b.unshift(h);if(h.x==f.x&&h.y==f.y)do f={x:~~(Math.random()*20),y:~~(Math.random()*20)};while(b.some(p=>p.x==f.x&&p.y==f.y));else b.pop();x.fillStyle='#171933';x.fillRect(0,0,400,400);x.fillStyle='#ff6f91';x.fillRect(f.x*20+3,f.y*20+3,14,14);b.forEach((p,i)=>{x.fillStyle=i?'#5ce5e6':'#fff';x.fillRect(p.x*20+2,p.y*20+2,16,16)})},120)</script></body></html>
