<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171933;color:white;font-family:Arial}.box{width:min(88vw,460px)}#g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{aspect-ratio:1;border:0;background:#5ce5e6;color:transparent;font-size:2rem;cursor:pointer}button.on{color:#171933;background:#ff9d66}p{text-align:center;color:#b7c4e5}</style></head><body><div class="box"><div id="g"></div><p>Match every pair</p></div><script>let a=['☀','☾','✦','♥','☁','⚡'],q=[...a,...a].sort(()=>Math.random()-.5),o=[],g=document.querySelector('#g');q.forEach((v,i)=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(o.length==2||b.classList.contains('on'))return;b.classList.add('on');o.push([b,i]);if(o.length==2&&q[o[0][1]]!=q[o[1][1]])setTimeout(()=>{o.forEach(x=>x[0].classList.remove('on'));o=[]},600);else if(o.length==2)o=[]};g.append(b)})</script></body></html>
